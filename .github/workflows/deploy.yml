# Publishes the tool to GitHub Pages (research.md, section 21). GitHub Pages serves it over HTTPS; keep "Enforce HTTPS" on in the settings
# of the repository. Nothing is published unless the unit, contract and end-to-end tests pass (Principles II and VIII).
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# One publication at a time; a run that is already publishing is let finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # npm run e2e runs the Chrome project and the Edge project
      - run: npx playwright install --with-deps chromium msedge
      - run: npm run e2e
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
