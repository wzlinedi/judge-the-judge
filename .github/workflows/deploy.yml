# Publishes the tool to GitHub Pages (research.md, section 21). GitHub Pages serves it over HTTPS; keep "Enforce HTTPS" on in the settings
# of the repository. Nothing is published unless the unit, contract and end-to-end tests pass (Principles II and VIII).
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; a run that is already publishing is let finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # npm run e2e runs the Chrome project and the Edge project
      - run: npx playwright install --with-deps chromium msedge
      - run: npm run e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
